<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>APPLE / select your next</title>
  <style>
    :root {
      --ink: #151515;
      --muted: #757575;
      --paper: #f5f3ef;
      --white: #fffdf9;
      --line: #ddd9d0;
      --lime: #d6ee67;
      --coral: #ff715b;
      --blue: #96d9ef;
      --lavender: #c7b9ef;
      --shadow: 0 16px 50px rgba(28, 28, 23, .08);
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin: 0; color: var(--ink); background: var(--paper); font-family: "Trebuchet MS", "Microsoft JhengHei", sans-serif; }
    button, select { font: inherit; }
    button { cursor: pointer; }
    .topbar { background: var(--ink); color: #fff; padding: 10px 5vw; display: flex; justify-content: center; font-size: 12px; letter-spacing: .14em; }
    header { padding: 25px 5vw 20px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--line); background: var(--paper); }
    .brand { display: flex; align-items: center; gap: 13px; text-decoration: none; color: var(--ink); }
    .brand-mark { width: 37px; height: 37px; display: grid; place-items: center; background: var(--lime); border-radius: 50%; font-weight: 900; font-size: 19px; }
    .brand-name { font-size: 17px; font-weight: 900; letter-spacing: .22em; }
    nav { display: flex; gap: 28px; font-size: 13px; font-weight: 700; }
    nav a { color: var(--ink); text-decoration: none; }
    nav a:hover { text-decoration: underline; text-underline-offset: 5px; }
    .cart { border: 1px solid var(--ink); background: transparent; border-radius: 99px; padding: 9px 14px; display: flex; gap: 8px; align-items: center; font-size: 12px; }
    .cart b { background: var(--coral); width: 19px; height: 19px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; }
    main { max-width: 1440px; margin: auto; padding: 0 5vw 90px; }
    .hero { min-height: 405px; padding: 65px 0 52px; display: grid; grid-template-columns: 1.1fr .9fr; gap: 40px; align-items: center; }
    .eyebrow { font-size: 11px; font-weight: 900; letter-spacing: .22em; color: var(--coral); margin: 0 0 20px; }
    h1 { font-size: clamp(44px, 7vw, 95px); line-height: .92; margin: 0; max-width: 760px; letter-spacing: -.05em; }
    .hero-copy { max-width: 475px; margin-top: 27px; color: var(--muted); line-height: 1.8; font-size: 14px; }
    .hero-art { position: relative; min-height: 260px; }
    .orbit { position: absolute; width: 250px; height: 250px; border: 1px solid var(--ink); border-radius: 50%; right: 12%; top: 0; }
    .orbit:before, .orbit:after { content: ""; position: absolute; border: 1px solid var(--ink); border-radius: 50%; transform: rotate(40deg); }
    .orbit:before { inset: 30px -22px; }
    .orbit:after { inset: -22px 30px; }
    .floating { position: absolute; border: 3px solid var(--ink); background: var(--white); box-shadow: 8px 10px 0 var(--ink); }
    .phone { width: 97px; height: 188px; border-radius: 21px; right: 32%; top: 36px; transform: rotate(12deg); background: linear-gradient(135deg, #d5ef65, #fdfcf8 60%); }
    .phone:before { content: ""; position: absolute; width: 33px; height: 7px; background: var(--ink); border-radius: 8px; top: 9px; left: 30px; }
    .laptop { width: 195px; height: 126px; border-radius: 9px 9px 2px 2px; right: 3%; top: 92px; transform: rotate(-9deg); background: linear-gradient(140deg, #d8d8d8, #777); }
    .laptop:after { content: ""; position: absolute; width: 230px; height: 9px; background: #666; bottom: -13px; left: -20px; border-radius: 3px 3px 8px 8px; }
    .tablet { width: 135px; height: 95px; border-radius: 12px; left: 11%; top: 144px; transform: rotate(-21deg); background: var(--blue); }
    .section-head { display: flex; align-items: end; justify-content: space-between; gap: 20px; margin: 34px 0 24px; }
    h2 { font-size: 32px; margin: 0; letter-spacing: -.04em; }
    .section-head p { color: var(--muted); font-size: 12px; margin: 0; }
    .filters { display: flex; gap: 9px; flex-wrap: wrap; margin-bottom: 26px; }
    .filter { border: 1px solid var(--line); background: transparent; border-radius: 99px; padding: 10px 16px; font-size: 12px; }
    .filter.active, .filter:hover { border-color: var(--ink); background: var(--ink); color: #fff; }
    .products { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
    .product { min-height: 390px; padding: 18px; display: flex; flex-direction: column; background: var(--white); border: 1px solid var(--line); position: relative; transition: transform .25s, box-shadow .25s; }
    .product:hover { transform: translateY(-6px); box-shadow: var(--shadow); }
    .tag { position: absolute; top: 15px; left: 15px; padding: 5px 8px; background: var(--coral); color: #fff; font-size: 10px; font-weight: 900; letter-spacing: .08em; }
    .product-visual { height: 208px; display: grid; place-items: center; margin-bottom: 12px; background: #efede7; overflow: hidden; }
    .device { position: relative; box-shadow: 7px 8px 0 rgba(21,21,21,.12); }
    .device.phone-device { width: 92px; height: 175px; border: 4px solid #262626; border-radius: 21px; }
    .device.phone-device:before { content: ""; position: absolute; width: 31px; height: 6px; border-radius: 8px; background: #202020; top: 8px; left: 27px; }
    .device.phone-device:after { content: ""; position: absolute; width: 34px; height: 34px; border: 5px solid #222; border-radius: 50%; left: 12px; top: 14px; box-shadow: 19px 0 0 -7px #222, 0 19px 0 -7px #222; }
    .device.tablet-device { width: 190px; height: 130px; border: 5px solid #272727; border-radius: 15px; }
    .device.tablet-device:after { content: ""; position: absolute; width: 5px; height: 5px; background: #333; border-radius: 50%; top: 5px; left: 91px; }
    .device.laptop-device { width: 190px; height: 124px; border: 5px solid #313131; border-radius: 8px 8px 2px 2px; }
    .device.laptop-device:after { content: ""; position: absolute; width: 220px; height: 8px; background: #454545; bottom: -15px; left: -20px; border-radius: 2px 2px 9px 9px; }
    .product h3 { margin: 0 0 6px; font-size: 16px; }
    .meta { color: var(--muted); font-size: 11px; min-height: 17px; }
    .bottom { margin-top: auto; display: flex; justify-content: space-between; align-items: end; gap: 10px; padding-top: 17px; }
    .price { font-size: 16px; font-weight: 900; }
    .buy { border: 0; padding: 10px 12px; background: var(--ink); color: white; font-size: 11px; font-weight: 900; }
    .buy:hover { background: var(--coral); }
    .empty { grid-column: 1 / -1; padding: 40px; text-align: center; background: var(--white); color: var(--muted); }
    footer { padding: 26px 5vw; border-top: 1px solid var(--line); display: flex; justify-content: space-between; color: var(--muted); font-size: 11px; }
    @media (max-width: 900px) { .products { grid-template-columns: repeat(2, 1fr); } .hero { grid-template-columns: 1fr; padding-top: 45px; } .hero-art { min-height: 220px; margin-top: -15px; } nav { display: none; } }
    @media (max-width: 530px) { header { padding-top: 18px; } .brand-name { font-size: 14px; } main { padding: 0 18px 60px; } .hero { min-height: 560px; padding-bottom: 0; } h1 { font-size: 57px; } .hero-art { transform: scale(.8); transform-origin: top center; margin-bottom: -40px; } .products { grid-template-columns: 1fr; } .product { min-height: 375px; } .section-head { display: block; } .section-head p { margin-top: 8px; } footer { display: block; line-height: 2; } }
  </style>
</head>
<body>
  <div class="topbar">新學期優惠｜指定商品享 12 期零利率</div>
  <header>
    <a class="brand" href="#top"><span class="brand-mark"></span><span class="brand-name">APPLE / SELECT</span></a>
    <nav><a href="#iphone">iPhone</a><a href="#macbook">MacBook Pro</a><a href="#ipad">iPad</a></nav>
    <button class="cart" type="button" aria-label="購物車">BAG <b id="cart-count">0</b></button>
  </header>
  <main id="top">
    <section class="hero">
      <div><p class="eyebrow">THE NEW EVERYDAY</p><h1>選一台，<br>開始下一幕。</h1><p class="hero-copy">把工作、創作與生活，放進更輕、更快、更懂你的裝置裡。探索 iPhone 17、iPhone 18、MacBook Pro 與 iPad 全系列。</p></div>
      <div class="hero-art" aria-hidden="true"><div class="orbit"></div><div class="floating phone"></div><div class="floating laptop"></div><div class="floating tablet"></div></div>
    </section>
    <section id="shop">
      <div class="section-head"><h2>全部商品</h2><p><span id="result-count">0</span> 件商品｜價格皆為台灣建議售價</p></div>
      <div class="filters" role="tablist" aria-label="商品分類"><button class="filter active" data-filter="all">全部</button><button class="filter" data-filter="iPhone">iPhone</button><button class="filter" data-filter="MacBook Pro">MacBook Pro</button><button class="filter" data-filter="iPad">iPad</button></div>
      <div id="iphone" class="products"></div>
    </section>
  </main>
  <footer><span>APPLE / SELECT</span><span>你的選擇，值得更好。</span></footer>
  <script>
    const products = [
      { category: 'iPhone', name: 'iPhone 17', spec: '256GB｜午夜黑、星光白', price: 29900, color: '#d6ee67', tag: 'NEW' },
      { category: 'iPhone', name: 'iPhone 17 Air', spec: '256GB｜天空藍、玫瑰粉', price: 32900, color: '#96d9ef', tag: 'NEW' },
      { category: 'iPhone', name: 'iPhone 17 Pro', spec: '256GB｜鈦原色、深空黑', price: 38900, color: '#c7b9ef', tag: 'PRO' },
      { category: 'iPhone', name: 'iPhone 17 Pro Max', spec: '256GB｜鈦原色、深空黑', price: 42900, color: '#ffb9a9', tag: 'PRO' },
      { category: 'iPhone', name: 'iPhone 18', spec: '256GB｜霧銀、晨曦金', price: 30900, color: '#96d9ef', tag: 'NEW' },
      { category: 'iPhone', name: 'iPhone 18 Air', spec: '256GB｜冰川藍、薰衣草紫', price: 34900, color: '#c7b9ef', tag: 'NEW' },
      { category: 'iPhone', name: 'iPhone 18 Pro', spec: '256GB｜鈦黑、鈦金', price: 40900, color: '#d6ee67', tag: 'PRO' },
      { category: 'iPhone', name: 'iPhone 18 Pro Max', spec: '512GB｜鈦黑、鈦金', price: 47900, color: '#ffb9a9', tag: 'PRO' },
      { category: 'MacBook Pro', name: 'MacBook Pro 14', spec: 'M4｜16GB｜512GB SSD', price: 54900, color: '#c7b9ef' },
      { category: 'MacBook Pro', name: 'MacBook Pro 14', spec: 'M4 Pro｜24GB｜512GB SSD', price: 69900, color: '#96d9ef' },
      { category: 'MacBook Pro', name: 'MacBook Pro 16', spec: 'M4 Pro｜24GB｜512GB SSD', price: 79900, color: '#ffb9a9' },
      { category: 'MacBook Pro', name: 'MacBook Pro 16', spec: 'M4 Max｜36GB｜1TB SSD', price: 99900, color: '#d6ee67' },
      { category: 'iPad', name: 'iPad 11', spec: 'A16｜128GB｜Wi-Fi', price: 11900, color: '#96d9ef' },
      { category: 'iPad', name: 'iPad mini', spec: 'A17 Pro｜128GB｜Wi-Fi', price: 16900, color: '#c7b9ef' },
      { category: 'iPad', name: 'iPad Air 11', spec: 'M3｜128GB｜Wi-Fi', price: 19900, color: '#d6ee67' },
      { category: 'iPad', name: 'iPad Air 13', spec: 'M3｜128GB｜Wi-Fi', price: 26900, color: '#ffb9a9' },
      { category: 'iPad', name: 'iPad Pro 11', spec: 'M4｜256GB｜Wi-Fi', price: 33900, color: '#96d9ef' },
      { category: 'iPad', name: 'iPad Pro 13', spec: 'M4｜256GB｜Wi-Fi', price: 44900, color: '#c7b9ef' }
    ];
    const grid = document.querySelector('.products');
    const money = value => `NT$ ${value.toLocaleString('en-US')}`;
    function productArt(product) {
      const className = product.category === 'iPhone' ? 'phone-device' : product.category === 'iPad' ? 'tablet-device' : 'laptop-device';
      return `<div class="product-visual" style="--accent:${product.color}"><div class="device ${className}" style="background:linear-gradient(135deg, ${product.color}, #fffdf9 75%)"></div></div>`;
    }
    function render(filter = 'all') {
      const visible = filter === 'all' ? products : products.filter(product => product.category === filter);
      document.querySelector('#result-count').textContent = visible.length;
      grid.innerHTML = visible.map(product => `<article class="product"><span class="tag">${product.tag || product.category.toUpperCase()}</span>${productArt(product)}<h3>${product.name}</h3><div class="meta">${product.spec}</div><div class="bottom"><span class="price">${money(product.price)}</span><button class="buy" data-name="${product.name}">加入購物袋</button></div></article>`).join('') || '<div class="empty">目前沒有符合的商品。</div>';
      grid.querySelectorAll('.buy').forEach(button => button.addEventListener('click', () => { document.querySelector('#cart-count').textContent = Number(document.querySelector('#cart-count').textContent) + 1; button.textContent = '已加入'; button.disabled = true; }));
    }
    document.querySelectorAll('.filter').forEach(button => button.addEventListener('click', () => { document.querySelectorAll('.filter').forEach(item => item.classList.remove('active')); button.classList.add('active'); render(button.dataset.filter); }));
    render();
  </script>
</body>
</html>
